name: IVS Build Artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - ivs/branding-signing

permissions:
  contents: read

jobs:
  build-artifacts:
    name: Build unsigned IVS release artifacts
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build iOS Simulator release
        run: |
          set -euo pipefail
          xcodebuild \
            -project bitchat.xcodeproj \
            -scheme "bitchat (iOS)" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .DerivedData/ios \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

          IOS_APP=$(find .DerivedData/ios/Build/Products -type d -name '*.app' | head -1)
          test -n "$IOS_APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$IOS_APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$IOS_APP/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "$IOS_APP" Bitchat-IVS-iOS-Simulator-Release.zip

      - name: Build macOS universal release
        run: |
          set -euo pipefail
          xcodebuild \
            -project bitchat.xcodeproj \
            -scheme "bitchat (macOS)" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath .DerivedData/macos \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

          MAC_APP=$(find .DerivedData/macos/Build/Products -type d -name '*.app' | head -1)
          test -n "$MAC_APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$MAC_APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$MAC_APP/Contents/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "$MAC_APP" Bitchat-IVS-macOS-Universal-Release.zip

      - name: Upload iOS Simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bitchat-IVS-iOS-Simulator-Release
          path: Bitchat-IVS-iOS-Simulator-Release.zip
          if-no-files-found: error

      - name: Upload macOS universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bitchat-IVS-macOS-Universal-Release
          path: Bitchat-IVS-macOS-Universal-Release.zip
          if-no-files-found: error
