name: IVS iOS Signed Release

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload the validated archive to App Store Connect / TestFlight
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ivs-ios-signed-release
  cancel-in-progress: false

jobs:
  archive:
    name: Archive Bitchat IVS for iOS
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate signing configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_BASE64; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          KEY_DIR="$RUNNER_TEMP/appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Show toolchain and IVS release identity
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          grep -E '^(PRODUCT_BUNDLE_IDENTIFIER|APP_GROUP_ID|APP_DISPLAY_NAME)[[:space:]]*=' Configs/Release.xcconfig

      - name: Archive signed iOS app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/BitchatIVS.xcarchive build/export
          xcodebuild \
            -project bitchat.xcodeproj \
            -scheme "bitchat (iOS)" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/BitchatIVS.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            clean archive

      - name: Verify signed archive identity and entitlements
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=$(find build/BitchatIVS.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' | head -1)
          test -n "$APP_PATH"
          echo "App: $APP_PATH"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" 2>/dev/null | plutil -p -

      - name: Create App Store Connect export options
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export IPA
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath build/BitchatIVS.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          IPA=$(find build/export -maxdepth 1 -type f -name '*.ipa' | head -1)
          test -n "$IPA"
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"
          shasum -a 256 "$IPA"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bitchat-IVS-iOS-Signed-IPA
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload archive diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: Bitchat-IVS-iOS-xcarchive
          path: build/BitchatIVS.xcarchive
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/UploadOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF
          plutil -lint "$RUNNER_TEMP/UploadOptions.plist"
          xcodebuild \
            -exportArchive \
            -archivePath build/BitchatIVS.xcarchive \
            -exportPath build/testflight-upload \
            -exportOptionsPlist "$RUNNER_TEMP/UploadOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
